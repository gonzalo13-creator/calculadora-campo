<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1a4d1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Calculadora de Campo</title>
<style>
:root {
  --bg: #eef1ee; --card: #fff; --text: #1a1a1a; --border: #ddd; 
  --primary: #1a4d1e; --primary-light: #3d7a42; --error: #c0392b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,Roboto,sans-serif;margin:0;padding:12px;background:var(--bg);color:var(--text);max-width:520px;margin:0 auto; padding-bottom: 30px;}
h1{font-size:1.2rem;color:var(--primary);text-align:center;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center;}
h1 button{background:none;border:none;font-size:1.4rem;cursor:pointer;}
.card{background:var(--card);border-radius:12px;padding:15px;margin-bottom:15px;box-shadow:0 2px 5px rgba(0,0,0,.1);}
h2{font-size:1.1rem;margin:0 0 10px 0;border-bottom:2px solid var(--border);padding-bottom:5px;color:var(--primary);}
.lbl{font-size:.8rem;font-weight:bold;margin-bottom:5px;display:block;opacity:0.8;}
input, select {width:100%;padding:12px;border:2px solid var(--border);border-radius:8px;font-size:1.1rem;margin-bottom:10px;font-weight:bold;}
.resultado{background:var(--primary);color:#fff;padding:15px;border-radius:10px;text-align:center;margin-top:10px;font-size:2.5rem;font-weight:900;}
.resultado.error{background:var(--error);font-size:1.5rem;}
.resultado span{font-size:1.2rem;font-weight:normal;}

.fila-relleno{display:grid;grid-template-columns:1fr 1fr 1.2fr 30px;gap:5px;margin-bottom:5px;align-items:center;}
.fila-relleno input{padding:8px;font-size:1rem;margin-bottom:0;text-align:center;}
.res-relleno{font-weight:bold;color:var(--primary);text-align:center;font-size:1.1rem;background:#e8f5e9;border-radius:5px;padding:8px 0;}
.btn-borrar-fila{background:var(--error);color:white;border:none;border-radius:8px;height:100%;font-size:1.2rem;cursor:pointer;display:flex;justify-content:center;align-items:center;}

.btn-add { background: var(--primary-light); color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
.btn-clear { background: var(--border); color: var(--text); border: none; padding: 12px; border-radius: 8px; font-size: 0.9rem; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }

#configScreen { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 999; padding: 15px; overflow-y: auto; }
#configScreen h2 { text-align: center; color: var(--primary); }
.cfg-item { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; background: var(--card); padding: 10px; border-radius: 8px; }
.cfg-item input[type="text"] { flex: 2; margin: 0; padding: 8px; font-size: 0.9rem; }
.cfg-item input[type="number"] { flex: 1; margin: 0; padding: 8px; font-size: 0.9rem; text-align: center; }
.cfg-item input[type="color"] { width: 40px; height: 40px; border: none; border-radius: 8px; padding: 0; }
.btn-borrar { background: var(--error); color: white; border: none; border-radius: 8px; padding: 10px; font-size: 1.1rem; cursor: pointer; }
.btn-volver { background: var(--primary); color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 1.1rem; font-weight: bold; margin-top: 15px; }
</style>
</head>
<body>

<h1>🌾 Calculadora Unidad 7 <button onclick="abrirConfig()">⚙️</button></h1>

<!-- SECCION 1: MEDIDAS -->
<div class="card">
  <h2>📏 Calcular Toneladas</h2>
  
  <span class="lbl">Nº de Silo o Entresilo</span>
  <input type="number" id="siloInput" placeholder="Ej: 315" oninput="calcularMedida()">
  
  <span class="lbl">Cereal</span>
  <select id="cerealSelectMedida" onchange="calcularMedida()"></select>
  
  <span class="lbl">Metros de vacío</span>
  <input type="number" id="metrosInput" placeholder="Ej: 15.5" step="0.1" oninput="calcularMedida()">
  
  <div class="resultado" id="resMedida">0 <span>t</span></div>
</div>

<!-- SECCION 2: RELLENOS -->
<div class="card">
  <h2>⛽ Calcular Relleno</h2>
  <p style="font-size:0.8rem;margin-top:-5px;">Poné el cereal y las toneladas actuales de cada silo.</p>
  
  <span class="lbl">Cereal para todos los cálculos</span>
  <select id="cerealSelectRelleno" onchange="recalcularTodosRellenos()"></select>

  <div class="fila-relleno" style="font-size:0.7rem;font-weight:bold;text-align:center;opacity:0.7;margin-top:10px;">
    <div>Silo</div>
    <div>Tons Act.</div>
    <div>Falta</div>
    <div></div>
  </div>

  <div id="listaRellenos">
    <!-- Las filas se cargan acá -->
  </div>

  <button class="btn-add" onclick="agregarFilaRelleno()">+ Agregar Silo</button>

  <div class="resultado" id="resTotalRelleno" style="margin-top:15px; font-size: 2rem;">
    Total: 0 <span>t</span>
  </div>
  
  <button class="btn-clear" onclick="limpiarRellenos()">🗑️ Limpiar Lista</button>
</div>

<!-- CONFIGURACION -->
<div id="configScreen">
  <h2>⚙️ Configurar Cereales</h2>
  <div id="listaConfig"></div>
  
  <h2 style="margin-top:20px;">Agregar Nuevo</h2>
  <div class="cfg-item">
    <input type="text" id="nuevoNombre" placeholder="Nombre">
    <input type="number" id="nuevoPH" placeholder="PH">
    <input type="color" id="nuevoColor" value="#888888">
    <button class="btn-borrar" style="background:var(--primary);" onclick="agregarCereal()">+</button>
  </div>

  <button class="btn-volver" onclick="cerrarConfig()">← Volver a la Calculadora</button>
  <button class="btn-volver" style="background:var(--error);margin-top:5px;" onclick="restaurarDefecto()">Restaurar por defecto</button>
</div>

<script>
const PH_BASE = 80;
const DATA = {
  silos:[[0,1221],[0.5,1204],[1,1187],[1.5,1170],[2,1153],[2.5,1136],[3,1119],[3.5,1102],[4,1085],[4.5,1068],[5,1051],[5.5,1034],[6,1017],[6.5,1000],[7,983],[7.5,966],[8,949],[8.5,932],[9,915],[9.5,898],[10,881],[10.5,864],[11,847],[11.5,830],[12,813],[12.5,796],[13,779],[13.5,762],[14,745],[14.5,728],[15,711],[15.5,694],[16,677],[16.5,660],[17,643],[17.5,626],[18,609],[18.5,592],[19,575],[19.5,558],[20,541],[20.5,524],[21,507],[21.5,490],[22,473],[22.5,456],[23,439],[23.5,422],[24,405],[24.5,388],[25,371],[25.5,354],[26,337],[26.5,320],[27,303],[27.5,286],[28,269],[28.5,252],[29,235],[29.5,218],[30,201],[30.5,184],[31,167],[31.5,150],[32,133],[32.5,116],[33,99],[33.5,82],[34,65],[34.5,48],[35,31],[35.5,23],[36,13],[36.5,8],[37,3.4],[37.5,1]],
  entresilos:[[0,311.5],[0.5,307.25],[1,303],[1.5,298.75],[2,294.5],[2.5,290.25],[3,286],[3.5,281.75],[4,277.5],[4.5,273.25],[5,269],[5.5,264.75],[6,260.5],[6.5,256.25],[7,252],[7.5,247.75],[8,243.5],[8.5,239.25],[9,235],[9.5,230.75],[10,226.5],[10.5,222.25],[11,218],[11.5,213.75],[12,209.5],[12.5,205.25],[13,201],[13.5,196.75],[14,192.5],[14.5,188.25],[15,184],[15.5,179.75],[16,175.5],[16.5,171.25],[17,167],[17.5,162.75],[18,158.5],[18.5,154.25],[19,150],[19.5,145.75],[20,141.5],[20.5,137.25],[21,133],[21.5,128.75],[22,124.5],[22.5,120.25],[23,116],[23.5,111.75],[24,107.5],[24.5,103.25],[25,99],[25.5,94.75],[26,90.5],[26.5,86.25],[27,82],[27.5,77.75],[28,73.5],[28.5,69.25],[29,65],[29.5,60.75],[30,56.5],[30.5,52.25],[31,48],[31.5,43.75],[32,39.5],[32.5,35.25],[33,31],[33.5,26.75],[34,22.5],[34.5,18.25],[35,14],[35.5,9.75],[36,6.5],[36.5,3.75],[37,1.25],[37.5,0.6]]
};

const MIN_14 = [702, 705, 708, 711, 714, 717];
const MIN_10 = [502, 505, 508, 511, 514, 517];

let cereales = [];

// --- INICIALIZACION ---
function cargarCereales() {
  let guardados = localStorage.getItem('cereales_v2');
  if(guardados) {
    cereales = JSON.parse(guardados);
  } else {
    cereales = [
      {id:'MAIZ', nombre:'MAÍZ', ph:76, color:'#f39c12'},
      {id:'SORGO', nombre:'SORGO', ph:72, color:'#2980b9'},
      {id:'SOJA', nombre:'SOJA', ph:71, color:'#f1c40f'},
      {id:'CEBADA', nombre:'CEBADA', ph:66, color:'#d35400'},
      {id:'GIRASOL', nombre:'GIRASOL', ph:42, color:'#ffffff'},
      {id:'TRIGO', nombre:'TRIGO', ph:78, color:'#27ae60'},
      {id:'MEZCLA', nombre:'MEZCLA', ph:75, color:'#e84393'}
    ];
  }
  actualizarSelects();
  cargarFilasGuardadas();
}

function actualizarSelects() {
  const selM = document.getElementById('cerealSelectMedida');
  const selR = document.getElementById('cerealSelectRelleno');
  
  let html = cereales.map(c => `<option value="${c.id}">${c.nombre} (PH ${c.ph})</option>`).join('');
  let htmlR = cereales.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
  
  selM.innerHTML = html;
  selR.innerHTML = htmlR;
}

function interpolar(tabla, metros) {
  if(metros <= tabla[0][0]) return tabla[0][1];
  if(metros >= tabla[tabla.length-1][0]) return tabla[tabla.length-1][1];
  for(let i=0; i<tabla.length-1; i++) {
    let a = tabla[i], b = tabla[i+1];
    if(metros >= a[0] && metros <= b[0]) {
      return a[1] + (b[1]-a[1]) * ((metros - a[0]) / (b[0] - a[0]));
    }
  }
  return 0;
}

// --- LOGICA MEDIDAS ---
function calcularMedida() {
  let siloStr = document.getElementById('siloInput').value;
  let cerealId = document.getElementById('cerealSelectMedida').value;
  let metrosStr = document.getElementById('metrosInput').value;
  let resDiv = document.getElementById('resMedida');
  
  let silo = parseInt(siloStr);
  let metros = parseFloat(metrosStr);

  if(isNaN(silo) || isNaN(metros) || !cerealId) {
    resDiv.innerHTML = '0 <span>t</span>';
    resDiv.className = 'resultado';
    return;
  }

  let tipo = null;
  if((silo >= 101 && silo <= 118) || (silo >= 301 && silo <= 318) || (silo >= 501 && silo <= 518) || (silo >= 701 && silo <= 718)) tipo = 'silos';
  else if((silo >= 201 && silo <= 217) || (silo >= 401 && silo <= 417) || (silo >= 601 && silo <= 617)) tipo = 'entresilos';
  
  if(!tipo) {
    resDiv.innerHTML = 'Silo Inválido';
    resDiv.className = 'resultado error';
    return;
  }

  if(MIN_14.includes(silo) && metros < 14) {
    resDiv.innerHTML = 'Mínimo 14.0 m';
    resDiv.className = 'resultado error';
    return;
  }
  if(MIN_10.includes(silo) && metros < 10) {
    resDiv.innerHTML = 'Mínimo 10.0 m';
    resDiv.className = 'resultado error';
    return;
  }

  let cerealObj = cereales.find(c => c.id === cerealId);
  let phRef = interpolar(DATA[tipo], metros);
  let tons = Math.round(phRef * cerealObj.ph / PH_BASE);

  resDiv.className = 'resultado';
  resDiv.innerHTML = `${tons} <span>t</span>`;
}

// --- LOGICA RELLENOS ---
function agregarFilaRelleno(silo="", tons="") {
  let cont = document.getElementById('listaRellenos');
  let div = document.createElement('div');
  div.className = 'fila-relleno';
  
  div.innerHTML = `
    <input type="number" placeholder="Silo" class="in-silo" value="${silo}" oninput="procesarCambioRelleno(this)">
    <input type="number" placeholder="Tons" class="in-tons" value="${tons}" oninput="procesarCambioRelleno(this)">
    <div class="res-relleno">- t</div>
    <button class="btn-borrar-fila" onclick="eliminarFilaRelleno(this)">×</button>
  `;
  cont.appendChild(div);
  
  if(silo && tons) {
    procesarCambioRelleno(div.querySelector('.in-tons'), false);
  }
}

function procesarCambioRelleno(inputEl, guardar=true) {
  calcularRelleno(inputEl);
  actualizarTotalRelleno();
  if(guardar) guardarFilasRelleno();
}

function calcularRelleno(inputEl) {
  let fila = inputEl.parentElement;
  let silo = parseInt(fila.querySelector('.in-silo').value);
  let tonsActuales = parseFloat(fila.querySelector('.in-tons').value);
  let resDiv = fila.querySelector('.res-relleno');
  
  let cerealId = document.getElementById('cerealSelectRelleno').value;
  let cerealObj = cereales.find(c => c.id === cerealId);

  if(isNaN(silo) || isNaN(tonsActuales) || !cerealObj) {
    resDiv.innerText = '- t';
    return;
  }

  let tipo = null;
  if((silo >= 101 && silo <= 118) || (silo >= 301 && silo <= 318) || (silo >= 501 && silo <= 518) || (silo >= 701 && silo <= 718)) tipo = 'silos';
  else if((silo >= 201 && silo <= 217) || (silo >= 401 && silo <= 417) || (silo >= 601 && silo <= 617)) tipo = 'entresilos';

  if(!tipo) {
    resDiv.innerText = 'Inv.';
    return;
  }

  let limiteMetros = tipo === 'silos' ? 1.0 : 4.0;
  if(MIN_14.includes(silo)) limiteMetros = 14.0;
  if(MIN_10.includes(silo)) limiteMetros = 10.0;

  let phRefLimite = interpolar(DATA[tipo], limiteMetros);
  let tonsLimite = Math.round(phRefLimite * cerealObj.ph / PH_BASE);

  let falta = tonsLimite - tonsActuales;
  if(falta < 0) falta = 0;

  resDiv.innerText = `${falta} t`;
}

function eliminarFilaRelleno(btn) {
  btn.parentElement.remove();
  actualizarTotalRelleno();
  guardarFilasRelleno();
}

function actualizarTotalRelleno() {
  let filas = document.querySelectorAll('.res-relleno');
  let total = 0;
  filas.forEach(f => {
    let txt = f.innerText.replace(' t', '').trim();
    let val = parseInt(txt);
    if(!isNaN(val)) total += val;
  });
  document.getElementById('resTotalRelleno').innerHTML = `Total: ${total} <span>t</span>`;
}

function recalcularTodosRellenos() {
  let inputs = document.querySelectorAll('#listaRellenos .in-tons');
  inputs.forEach(inp => {
    if(inp.value) calcularRelleno(inp);
  });
  actualizarTotalRelleno();
  guardarFilasRelleno();
}

function limpiarRellenos() {
  if(confirm("¿Borrar todos los rellenos de la lista?")) {
    document.getElementById('listaRellenos').innerHTML = '';
    agregarFilaRelleno(); // Deja una vacía
    actualizarTotalRelleno();
    guardarFilasRelleno();
  }
}

function guardarFilasRelleno() {
  let datos = [];
  let filas = document.querySelectorAll('#listaRellenos .fila-relleno');
  filas.forEach(f => {
    let silo = f.querySelector('.in-silo').value;
    let tons = f.querySelector('.in-tons').value;
    if(silo || tons) datos.push({silo, tons});
  });
  localStorage.setItem('rellenos_v1', JSON.stringify(datos));
}

function cargarFilasGuardadas() {
  let guardados = localStorage.getItem('rellenos_v1');
  if(guardados) {
    let datos = JSON.parse(guardados);
    if(datos.length > 0) {
      datos.forEach(d => agregarFilaRelleno(d.silo, d.tons));
    } else {
      agregarFilaRelleno();
    }
  } else {
    agregarFilaRelleno();
  }
  actualizarTotalRelleno();
}

// --- CONFIGURACION ---
function abrirConfig() {
  renderizarConfig();
  document.getElementById('configScreen').style.display = 'block';
}

function cerrarConfig() {
  document.getElementById('configScreen').style.display = 'none';
  actualizarSelects();
  calcularMedida();
  recalcularTodosRellenos();
}

function renderizarConfig() {
  let lista = document.getElementById('listaConfig');
  lista.innerHTML = '';
  cereales.forEach(c => {
    let div = document.createElement('div');
    div.className = 'cfg-item';
    div.innerHTML = `
      <input type="text" value="${c.nombre}" onchange="editarCereal('${c.id}', 'nombre', this.value)">
      <input type="number" value="${c.ph}" onchange="editarCereal('${c.id}', 'ph', this.value)">
      <input type="color" value="${c.color}" onchange="editarCereal('${c.id}', 'color', this.value)">
      <button class="btn-borrar" onclick="borrarCereal('${c.id}')">×</button>
    `;
    lista.appendChild(div);
  });
}

function editarCereal(id, campo, valor) {
  let c = cereales.find(x => x.id === id);
  if(c) {
    if(campo === 'ph') valor = parseFloat(valor);
    if(campo === 'nombre') valor = valor.toUpperCase();
    c[campo] = valor;
    guardarCereales();
  }
}

function borrarCereal(id) {
  if(confirm("¿Borrar este cereal?")) {
    cereales = cereales.filter(x => x.id !== id);
    guardarCereales();
    renderizarConfig();
  }
}

function agregarCereal() {
  let nom = document.getElementById('nuevoNombre').value.trim().toUpperCase();
  let ph = parseFloat(document.getElementById('nuevoPH').value);
  let col = document.getElementById('nuevoColor').value;
  
  if(!nom || isNaN(ph)) return alert("Completá nombre y PH");
  
  let id = 'C' + Date.now();
  cereales.push({id, nombre: nom, ph: ph, color: col});
  guardarCereales();
  
  document.getElementById('nuevoNombre').value = '';
  document.getElementById('nuevoPH').value = '';
  renderizarConfig();
}

function guardarCereales() {
  localStorage.setItem('cereales_v2', JSON.stringify(cereales));
}

function restaurarDefecto() {
  if(confirm("¿Volver a los cereales originales? Se perderán los cambios.")) {
    localStorage.removeItem('cereales_v2');
    cargarCereales();
    cerrarConfig();
  }
}

// INICIAR
cargarCereales();
</script>
</body>
</html>
